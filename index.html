<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FIFA World Cup 2026" />
    <meta id="meta-theme-color" name="theme-color" content="#1a1d27" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('wc2026_theme') === 'light')
            document.documentElement.setAttribute('data-theme', 'light')
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Controle seu álbum de figurinhas da Copa do Mundo 2026" />
    <link rel="icon" type="image/png" href="/opening_img.png" />
    <link rel="apple-touch-icon" href="/opening_img.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>FIFA World Cup 2026 — Figurinhas</title>
  </head>
  <body>
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <img
        class="app-splash__img"
        src="/opening_img.png"
        alt=""
        decoding="async"
        onerror="this.onerror=null;if(this.src.indexOf('.png')!==-1)this.src='/opening_img.jpg';else this.closest('#app-splash')?.remove()"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
